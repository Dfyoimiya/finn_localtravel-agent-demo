[project]
name = "finn"
version = "0.1.0"
description = "Local short-trip planning agent — DAG + ReAct hybrid architecture"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.6.0",
    "langchain-core>=0.3.0",
    "openai>=1.0.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "prompt-toolkit>=3.0.52",
    "rich>=15.0.0",
]

[project.scripts]
finn = "finn.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finn"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
